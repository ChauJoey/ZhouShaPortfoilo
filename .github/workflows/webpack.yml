name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main", "master" ] # 这里同时监听 main 和 master 分支，省得麻烦

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20 # 用 20 比较稳定，而且不会有警告
          cache: 'npm'

      - name: Install dependencies
        run: npm install # 官方模板用的 npm install，这里保持一致避免没 lock 文件报错

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # ⚠️ 这里是重点：如果是 Vite 默认产物是 dist；如果是 React(CRA) 默认是 build
          # 请检查你本地构建后生成的是哪个文件夹，填错这里依然会报错找不到文件！
          path: './dist' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
